name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Fix All Errors
        run: |
          rm -f app/google-services.json
          rm -f google-services.json
          sed -i "/google-services/d" app/build.gradle || true
          sed -i "/google-services/d" build.gradle || true
          sed -i "/gms.google-services/d" app/build.gradle || true
          sed -i "/gms.google-services/d" build.gradle || true
          sed -i "/com.google.gms.google-services/d" app/build.gradle || true
          keytool -genkey -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Debug" -noprompt || true
          keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Debug" -noprompt || true
          chmod +x ./gradlew || true
      - run: ./gradlew assembleDebug -x processDebugGoogleServices -x processReleaseGoogleServices
      - uses: actions/upload-artifact@v4
        with:
          name: Iron-Frontiers-APK
          path: app/build/outputs/apk/debug/app-debug.apk
