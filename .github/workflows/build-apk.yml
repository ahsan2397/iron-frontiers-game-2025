name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Fix All Errors
        run: |
          rm -f app/google-services.json
          rm -f google-services.json
          sed -i "/google-services/d" app/build.gradle || true
          sed -i "/gms.google-services/d" app/build.gradle || true
          sed -i "/com.google.gms.google-services/d" app/build.gradle || true
          sed -i "/google-services/d" build.gradle || true
          find . -name "gradlew" -exec chmod +x {} \; || true
          ls -la
      - name: Build APK
        run: gradle assembleDebug -x processDebugGoogleServices -x processReleaseGoogleServices --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Iron-Frontiers-APK
          path: app/build/outputs/apk/debug/app-debug.apk
