name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Fix All Errors
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"iron"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","package_name":"com.aistudio.applet.lkolwh"},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          keytool -genkey -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Debug" -noprompt || true
          keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Debug" -noprompt || true
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Iron-Frontiers-APK
          path: app/build/outputs/apk/debug/app-debug.apk
